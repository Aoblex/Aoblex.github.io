baseURL = "https://aoblex.github.io/"
title = "trytry's blog"
locale = "en"
timeZone = "Asia/Shanghai"
theme = "PaperMod"

[outputs]
home = ["HTML", "RSS", "JSON"]

[markup]
[markup.goldmark]
[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [['\[', '\]'], ['$$', '$$']]
inline = [['\(', '\)']]

[params]
math = true
mainSections = ["posts"]
# https://adityatelange.github.io/hugo-PaperMod/posts/papermod/papermod-features
ShowReadingTime = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowShareButtons = false
ShowToc = true

[params.homeInfoParams]
Title = "trytry's home"
Content = "Hi there!"

[[params.socialIcons]]
name = "github"
url = "https://github.com/Aoblex"

[[params.socialIcons]]
name = "email"
url = "iamwangchenrui@gmail.com"

[menus]
# Hugo menus: https://gohugo.io/configuration/menus/

[[menus.main]]
name = "Posts"
pageRef = "/posts"
weight = 10

[[menus.main]]
name = "Archives"
pageRef = "/archives"
weight = 20

[[menus.main]]
name = "Search"
pageRef = "/search"
weight = 30

[[menus.main]]
name = "About"
pageRef = "/about"
weight = 40
